# cf-deployment now ships cflinuxfs5 natively (release, cc stack,
# cflinuxfs5-rootfs-setup job, preloaded rootfs, buildpack/cnb lifecycle
# bundles). Adding those again here produces "Duplicate release name
# 'cflinuxfs5'" (and would duplicate the job/stack/rootfs too).
#
# This ops-file therefore only does what cf-deployment does NOT:
#   1. Point the cflinuxfs5 release at the locally-built dev release that the
#      deploy step uploads via `bosh upload-release` (replacing the published
#      beta URL/version), so CATS exercise the freshly-built rootfs.
#   2. Make cflinuxfs5 the default stack (cf-deployment defaults to cflinuxfs4).

- type: replace
  path: /releases/name=cflinuxfs5
  value:
    name: cflinuxfs5
    version: latest

- type: replace
  path: /instance_groups/name=api/jobs/name=cloud_controller_ng/properties/cc/default_stack
  value: cflinuxfs5
