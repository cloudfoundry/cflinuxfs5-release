name: 'Download Buildpacks'
description: 'Download the latest official Cloud Foundry buildpacks from cloudfoundry/<name>-buildpack GitHub releases'

inputs:
  stack:
    description: 'Stack name (e.g., cflinuxfs5)'
    required: true
  output_dir:
    description: 'Directory to download buildpacks to'
    required: false
    default: 'buildpacks'
  github_token:
    description: 'GitHub token used for the release downloads (defaults to the workflow token)'
    required: false
    default: ${{ github.token }}

outputs:
  go_buildpack:
    description: 'Path to Go buildpack'
    value: ${{ steps.download.outputs.go_buildpack }}
  ruby_buildpack:
    description: 'Path to Ruby buildpack'
    value: ${{ steps.download.outputs.ruby_buildpack }}
  nodejs_buildpack:
    description: 'Path to Node.js buildpack'
    value: ${{ steps.download.outputs.nodejs_buildpack }}
  python_buildpack:
    description: 'Path to Python buildpack'
    value: ${{ steps.download.outputs.python_buildpack }}
  staticfile_buildpack:
    description: 'Path to Staticfile buildpack'
    value: ${{ steps.download.outputs.staticfile_buildpack }}
  nginx_buildpack:
    description: 'Path to Nginx buildpack'
    value: ${{ steps.download.outputs.nginx_buildpack }}
  binary_buildpack:
    description: 'Path to Binary buildpack'
    value: ${{ steps.download.outputs.binary_buildpack }}
  dotnet_core_buildpack:
    description: 'Path to DotNet Core buildpack'
    value: ${{ steps.download.outputs.dotnet_core_buildpack }}
  java_buildpack:
    description: 'Path to Java buildpack'
    value: ${{ steps.download.outputs.java_buildpack }}
  php_buildpack:
    description: 'Path to PHP buildpack'
    value: ${{ steps.download.outputs.php_buildpack }}
  r_buildpack:
    description: 'Path to R buildpack'
    value: ${{ steps.download.outputs.r_buildpack }}

runs:
  using: 'composite'
  steps:
    - name: Download official buildpacks from GitHub releases
      id: download
      shell: bash
      env:
        GH_TOKEN: ${{ inputs.github_token }}
      run: |
        set -euo pipefail

        STACK="${{ inputs.stack }}"
        OUTPUT_DIR="${{ inputs.output_dir }}"

        mkdir -p "$OUTPUT_DIR"

        # Each entry is "<buildpack-name>:<output-key>".
        # <buildpack-name> matches both the cloudfoundry/<name>-buildpack repo and
        # the release-asset prefix (<name>-buildpack-<stack>-v<version>.zip).
        BUILDPACKS=(
          "go:go_buildpack"
          "ruby:ruby_buildpack"
          "nodejs:nodejs_buildpack"
          "python:python_buildpack"
          "staticfile:staticfile_buildpack"
          "nginx:nginx_buildpack"
          "binary:binary_buildpack"
          "dotnet-core:dotnet_core_buildpack"
          "java:java_buildpack"
          "php:php_buildpack"
          "r:r_buildpack"
        )

        download_buildpack() {
          local name=$1
          local output_var=$2
          local repo="cloudfoundry/${name}-buildpack"

          echo "::group::${name}-buildpack (${repo})"

          local tag
          tag=$(gh release view --repo "${repo}" --json tagName --jq '.tagName')
          echo "Latest tag: ${tag}"

          local zip_name="${name}-buildpack-${STACK}-${tag}.zip"
          local sum_name="${zip_name}.SHA256SUM.txt"

          gh release download "${tag}" \
            --repo "${repo}" \
            --pattern "${zip_name}" \
            --pattern "${sum_name}" \
            --dir "${OUTPUT_DIR}" \
            --clobber

          if [[ ! -f "${OUTPUT_DIR}/${zip_name}" ]]; then
            echo "ERROR: ${zip_name} not found in release ${tag} of ${repo}" >&2
            echo "       (no official ${STACK} build for this buildpack version?)" >&2
            exit 1
          fi

          # Verify checksum to make sure we got an intact, untampered asset.
          (cd "${OUTPUT_DIR}" && sha256sum -c "${sum_name}")

          echo "${output_var}=${OUTPUT_DIR}/${zip_name}" >> "$GITHUB_OUTPUT"
          echo "Downloaded and verified: ${OUTPUT_DIR}/${zip_name}"
          echo "::endgroup::"
        }

        for entry in "${BUILDPACKS[@]}"; do
          IFS=':' read -r name output_var <<< "${entry}"
          download_buildpack "${name}" "${output_var}"
        done

        echo ""
        echo "Downloaded buildpacks:"
        ls -la "${OUTPUT_DIR}"
