name: 'Generate Release Notes'
description: 'Generate release notes (release-body/body) with a real package changelog derived from receipts'

inputs:
  stack:
    description: 'Stack name'
    required: true
  current_version:
    description: 'Current final version being released'
    required: true
  previous_version:
    description: 'Previous release tag to reference (optional)'
    required: false
    default: ''
  type:
    description: 'Type to generate notes for: stack (rootfs/source) or release (final tgz artifact)'
    required: true
    default: 'release'
  bucket_name:
    description: 'S3 bucket holding the receipts (required to render the package changelog)'
    required: false
    default: ''
  cves_ref:
    description: 'Pinned public-buildpacks-ci-robots commit containing security notices'
    required: false
    default: ''
  ubuntu_codename:
    description: 'Ubuntu codename used by the CVE notifier'
    required: false
    default: 'ubuntu24.04'

runs:
  using: 'composite'
  steps:
    - name: Checkout security notice snapshot
      if: inputs.cves_ref != ''
      uses: actions/checkout@v4
      with:
        repository: cloudfoundry/public-buildpacks-ci-robots
        ref: ${{ inputs.cves_ref }}
        path: cve-snapshot

    - name: Download current receipt
      if: inputs.bucket_name != ''
      uses: ./.github/actions/download-s3
      with:
        stack: ${{ inputs.stack }}
        version: ${{ inputs.current_version }}
        bucket_name: ${{ inputs.bucket_name }}
        artifact_type: receipt
      continue-on-error: true

    - name: Download previous receipt
      if: inputs.bucket_name != '' && inputs.previous_version != ''
      uses: ./.github/actions/download-s3
      with:
        stack: ${{ inputs.stack }}
        version: ${{ inputs.previous_version }}
        bucket_name: ${{ inputs.bucket_name }}
        artifact_type: receipt
      continue-on-error: true

    - name: Generate release notes
      shell: bash
      env:
        CVES_REF: ${{ inputs.cves_ref }}
        UBUNTU_CODENAME: ${{ inputs.ubuntu_codename }}
      run: |
        set -euo pipefail

        STACK="${{ inputs.stack }}"
        VERSION="${{ inputs.current_version }}"
        PREV_VERSION="${{ inputs.previous_version }}"

        CURRENT_RECEIPT="receipt-artifacts/receipt.${STACK}.x86_64-${VERSION}"
        PREVIOUS_RECEIPT="receipt-artifacts/receipt.${STACK}.x86_64-${PREV_VERSION}"

        mkdir -p release-body
        {
          echo "# ${STACK} ${VERSION}"
          echo
          if [[ -n "$PREV_VERSION" ]]; then
            echo "Diff from **${PREV_VERSION}**"
            echo
          fi

          # Pull rootfs SHASUM / package count straight out of the receipt header.
          if [[ -f "$CURRENT_RECEIPT" ]]; then
            SHASUM="$(awk -F': *' '/^Rootfs SHASUM:/ {print $2; exit}' "$CURRENT_RECEIPT" || true)"
            PKGS="$(awk -F': *' '/^Packages:/ {print $2; exit}' "$CURRENT_RECEIPT" || true)"
            [[ -n "${SHASUM:-}" ]] && echo "Rootfs SHASUM: \`${SHASUM}\`"
            [[ -n "${PKGS:-}" ]]   && echo "Packages: ${PKGS}"
            echo
          fi

          if [[ -n "$CVES_REF" ]]; then
            ruby "${GITHUB_ACTION_PATH}/../../scripts/unreleased-usns.rb" render \
              "cve-snapshot/new-cve-notifications/${UBUNTU_CODENAME}.yml" "$VERSION"
          fi

          if [[ -f "$CURRENT_RECEIPT" ]]; then
            PREV_ARG=""
            [[ -n "$PREV_VERSION" && -f "$PREVIOUS_RECEIPT" ]] && PREV_ARG="$PREVIOUS_RECEIPT"
            bash "${GITHUB_ACTION_PATH}/../../scripts/receipt-delta.sh" "$PREV_ARG" "$CURRENT_RECEIPT"
          else
            # Fallback when no receipt is available (e.g. bucket_name not supplied).
            echo "## Changes"
            echo
            case "${{ inputs.type }}" in
              "stack")   echo "- Updated rootfs packages and dependencies (see attached receipt)";;
              "release") echo "- Rootfs finalized from RC (see attached receipt for package versions)";;
            esac
          fi
        } > release-body/body

        echo "=== Release notes ==="
        cat release-body/body
