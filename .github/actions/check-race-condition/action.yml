name: 'Check Race Condition'
description: 'Check for race conditions in rootfs builds'

inputs:
  stack:
    description: 'Stack name'
    required: true
  owner:
    description: 'GH repo owner'
    required: true
  github_token:
    description: 'GH repo token'
    required: true
  current_version:
    description: 'Current version being tested'
    required: true

outputs:
  success:
    description: 'Whether race condition check passed'
    value: ${{ steps.check.outputs.success }}

runs:
  using: 'composite'
  steps:
    - name: Checkout buildpacks-ci
      uses: actions/checkout@v4
      with:
        repository: cloudfoundry/buildpacks-ci
        ref: master
        path: buildpacks-ci

    - name: Get latest version
      id: latest-version
      uses: actions/github-script@v7
      with:
        github-token: ${{ inputs.github_token }}
        script: |
          try {
            const { data: releases } = await github.rest.repos.listReleases({
              owner: '${{ inputs.owner }}',
              repo: '${{ inputs.stack }}',
              per_page: 1
            });
            const latestTag = releases.length > 0 ? releases[0].tag_name : '';
            core.setOutput('version', latestTag);
          } catch (error) {
            console.log('No previous releases found:', error.message);
            core.setOutput('version', '');
          }

    - name: Check for race condition
      id: check
      shell: bash
      run: |
        set -euo pipefail   
        
        cd buildpacks-ci
        
        CURRENT_VERSION="${{ inputs.current_version }}"
        LATEST_VERSION="${{ steps.latest-version.outputs.version }}"
        
        echo "Current version being tested: $CURRENT_VERSION"
        echo "Latest released version: $LATEST_VERSION"
        
        CURRENT_CLEAN="${CURRENT_VERSION#v}"
        LATEST_CLEAN="${LATEST_VERSION#v}"
        
        if [[ -z "$LATEST_VERSION" ]]; then
          echo "No previous releases found, no race condition possible"
          echo "success=true" >> $GITHUB_OUTPUT
          exit 0
        fi
        
        # Compare two versions. Returns:
        #   0 if $1 == $2
        #   1 if $1 >  $2
        #   2 if $1 <  $2
        # Understands semver pre-release suffixes (e.g. 0.59.0-rc.3 < 0.59.0)
        # and is safe under `set -u` even when the two versions have a
        # different number of dot-separated components.
        version_compare() {
          local v1="$1" v2="$2"

          if [[ "$v1" == "$v2" ]]; then
            return 0
          fi

          # Split each version into its numeric base and an optional
          # pre-release part separated by `-` (e.g. "0.59.0-rc.3").
          local base1="${v1%%-*}" pre1=""
          [[ "$v1" == *-* ]] && pre1="${v1#*-}"
          local base2="${v2%%-*}" pre2=""
          [[ "$v2" == *-* ]] && pre2="${v2#*-}"

          # Compare the numeric base components one by one, treating
          # missing trailing components as 0 (so 1.2 == 1.2.0).
          local IFS=.
          local a=($base1) b=($base2)
          local len=$(( ${#a[@]} > ${#b[@]} ? ${#a[@]} : ${#b[@]} ))
          local i x y
          for ((i=0; i<len; i++)); do
            x="${a[i]:-0}"
            y="${b[i]:-0}"
            if ((10#$x > 10#$y)); then return 1; fi
            if ((10#$x < 10#$y)); then return 2; fi
          done

          # Numeric bases are equal: a pre-release is older than the
          # corresponding final release (semver rule).
          if [[ -z "$pre1" && -n "$pre2" ]]; then return 1; fi
          if [[ -n "$pre1" && -z "$pre2" ]]; then return 2; fi
          if [[ "$pre1" < "$pre2" ]]; then return 2; fi
          if [[ "$pre1" > "$pre2" ]]; then return 1; fi
          return 0
        }
        
        rc=0
        version_compare "$CURRENT_CLEAN" "$LATEST_CLEAN" || rc=$?
        
        case $rc in
          0|1)
            echo "No race condition detected. Current version ($CURRENT_VERSION) is >= latest ($LATEST_VERSION)"
            echo "success=true" >> $GITHUB_OUTPUT
            ;;
          2)
            echo "RACE CONDITION DETECTED!"
            echo "Current version ($CURRENT_VERSION) is older than latest released version ($LATEST_VERSION)"
            echo "This indicates another build completed and was released while this build was running."
            echo "success=false" >> $GITHUB_OUTPUT
            exit 1
            ;;
        esac

    - name: Log race condition result
      shell: bash
      run: |
        if [[ "${{ steps.check.outputs.success }}" == "true" ]]; then
          echo "Race condition check passed - safe to proceed with release"
        else
          echo "Race condition detected - blocking release"
        fi
