name: 'Create BOSH Release Notes'
description: 'Generate GitHub release notes for BOSH release'

# NOTE: The GitHub release body for the BOSH release is authoritatively produced
# by ./.github/actions/generate-release-notes (invoked via upload-to-github with
# type=release), which now emits the usage snippet AND a package changelog.
# This action's output is overwritten by that step and is kept only for
# backwards compatibility / standalone use.

inputs:
  stack:
    description: 'Stack name'
    required: true
  version:
    description: 'Version for the BOSH release'
    required: true

runs:
  using: 'composite'
  steps:
    - name: Generate BOSH release notes
      shell: bash
      run: |
        set -euo pipefail

        mkdir -p release-body
        {
          echo "# ${{ inputs.stack }} BOSH Release v${{ inputs.version }}"
          echo
          echo "Includes rootfs tarball and final BOSH release."
          echo
          echo "## Usage"
          echo '```yaml'
          echo "releases:"
          echo "- name: ${{ inputs.stack }}"
          echo "  version: ${{ inputs.version }}"
          echo '```'
        } > release-body/body

        echo "BOSH release notes generated for v${{ inputs.version }}"
